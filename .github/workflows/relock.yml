name: relock
on:
  push:
    branches: [chore/relock-linux]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Regenerate lockfile on Linux
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sanity-check npm ci with the new lock
        run: |
          rm -rf node_modules
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push regenerated lockfile to a fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/ci-lockfile-linux
          git add package-lock.json
          git commit -m "fix(build): regenerate package-lock on linux so npm ci is consistent" || echo "no change"
          git push -f origin fix/ci-lockfile-linux
